    context: null
    tags: ["pdb", "load"]

  - id: add-file-generic
    utterance: "Load a structure from file 'myfile.pdb'"
    dsl: 'add_structure(filePath="myfile.pdb")'
    entities: ["structure"]
    context: null
    tags: ["file", "load"]

  - id: add-pdb-1crn
