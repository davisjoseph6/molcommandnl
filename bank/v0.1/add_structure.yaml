schema: molcommand-sample-bank
schema_version: 1
verb: add_structure
items:
  - id: add-pdb-3eam
    utterance: "Load a protein from the PDB with ID 3eam"
    dsl: 'add_structure(PDBID="3eam")'
    entities: ["structure"]
    context: null
    tags: ["pdb", "load"]

  - id: add-pdb-1kx2
    utterance: "Load PDB ID 1kx2"
