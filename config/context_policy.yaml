context_gate:
  # When the scene is “simple”, we usually avoid context unless the LLM says needed.
  # Once we pass this number of updates, we bias toward using context.
  update_threshold: 8

  # Optional richer notion of complexity (still config-driven, no hardcoding).
  complexity:
    enabled: true
    weights:
      updates: 1.0
      structures: 2.0
      selections: 0.5
    threshold: 12.0

  llm:
    system_prompt_path: molcommand/system_prompt_entity_context.txt
    user_prompt_path: molcommand/user_prompt_entity_context.txt
    # Ask for a strict machine-readable format to avoid brittle parsing:
    output_format: "yaml"   # "yaml" or "json"
    max_retries: 1

context_retrieval:
  enabled: true
  recent_turns: 6
  top_k: 4
  max_chars: 3500

  history_store:
    jsonl_path: data/context_history.jsonl

  vector_store:
    enabled: true
    chroma_dir: data/chroma_history
    collection: scene_history
